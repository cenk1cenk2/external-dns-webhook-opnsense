---
default:
  interruptible: true

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^renovate\//
      when: never
    - when: always

stages:
  - install
  - build
  - version
  - publish

include:
  - project: devops/pipelines
    ref: go@2.0.1
    file:
      - /go/install.gitlab-ci.yml
      - /go/lint.gitlab-ci.yml
      - /go/test.gitlab-ci.yml
      - /go/build.gitlab-ci.yml

  - project: devops/pipelines
    ref: semantic-release@2.0.1
    file:
      - /semantic-release/publish.gitlab-ci.yml

  - project: devops/pipelines
    ref: buildah@2.0.1
    file:
      - /buildah/build.gitlab-ci.yml
      - /buildah/registry-dockerhub.gitlab-ci.yml

  - project: devops/pipelines
    ref: references@1.3.0
    file:
      - /references/github-token.gitlab-ci.yml

  - project: devops/pipelines
    ref: references@1.3.0
    file: /references/github-status.gitlab-ci.yml
    inputs:
      app_id_variable: PIPELINES_GITHUB_APP_ID
      installation_id_variable: PIPELINES_GITHUB_APP_INSTALLATION_ID
      private_key_variable: PIPELINES_GITHUB_APP_PRIVATE_KEY

variables:
  GO_VERSION: "1.27-alpine"
  GITHUB_STATUS_PROJECT: cenk1cenk2/external-dns-webhook-opnsense

install:
  stage: install
  extends:
    - .go-install
lint:
  stage: build
  extends:
    - .go-lint
test:
  stage: build
  extends:
    - .go-test
build:
  stage: build
  variables:
    CGO_ENABLED: false
    GO_BUILD_LINKER: -w -s
    GO_BUILD_VARIABLES: |-
      main.VERSION: '{{ env "CI_COMMIT_TAG" | default (printf "BUILD.%s" (now | date "2006-01-02T15:04:05Z0700")) }}'
    GO_BUILD_BINARY_NAME: external-dns-webhook-opnsense
  extends:
    - .go-build

github-token:
  stage: .pre
  extends:
    - .github-token
  variables:
    GITHUB_APP_ID: ${SEMANTIC_RELEASE_GITHUB_APP_ID}
    GITHUB_APP_INSTALLATION_ID: ${SEMANTIC_RELEASE_GITHUB_APP_INSTALLATION_ID}
    GITHUB_APP_PRIVATE_KEY: ${SEMANTIC_RELEASE_GITHUB_APP_PRIVATE_KEY}
    GITHUB_TOKEN_REPOSITORIES: external-dns-webhook-opnsense
    GITHUB_TOKEN_PERMISSIONS: '{"contents":"write","issues":"write","pull_requests":"write"}'
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: on_success
    - if: "$CI_COMMIT_REF_NAME =~ /^(next|next-major|alpha|beta|rc)$/"
      when: on_success
    - when: never

version:
  stage: version
  extends:
    - .semantic-release
  needs:
    - github-token
    - github-status-pending
    - install
    - lint
    - test
    - build
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: on_success
    - if: "$CI_COMMIT_REF_NAME =~ /^(next|next-major|alpha|beta|rc)$/"
      when: on_success
    - when: never

publish:
  stage: publish
  variables:
    CONTAINER_IMAGE_NAME: cenk1cenk2/external-dns-webhook-opnsense
    CONTAINER_IMAGE_TAGS: $CI_COMMIT_TAG
    CONTAINER_IMAGE_BUILD_ARGS: |-
      BIN: ./dist/external-dns-webhook-opnsense-linux-amd64
  extends:
    - .container-build
  rules:
    - if: $CI_COMMIT_TAG
